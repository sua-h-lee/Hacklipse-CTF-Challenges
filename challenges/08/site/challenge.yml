hints:
  - content: "공기가 '짭짤'했다는 건 실내 이야기가 아닙니다. 넓은 잔디밭 + 흰색 파라솔/셰이드 + 수평선이 한 프레임에 들어오는 바닷가 대형 카페를 지도에서 찾아보세요."
    cost: 0
  - content: "눈으로 찾기 어렵다면 사진 자체를 넣으세요. 구글 렌즈 / 네이버 스마트렌즈 / Yandex 이미지 검색에 cafe.png 를 업로드하면 같은 장소의 블로그 후기 사진이 걸립니다."
    cost: 20
