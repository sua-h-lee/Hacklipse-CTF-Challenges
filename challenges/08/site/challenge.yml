# CTFd 호환 challenge.yml (ctfcli)
name: "짭짤한 공기"
author: ""
category: OSINT
description: |
  작년 10월에 공부를 열심히 하다가 머리도 식힐겸 친구와 카페를 갔던 사진이다.
  카페도 이쁘고 음료도 맛있었던거 같은데, 위치가 어디더라....?
  공기가 짭짤했던거 같은데,,,,,

  ---

  **Flag format:** `hacklipse{상호명}`
  - 상호명은 지도 앱(네이버 지도 / 카카오맵)에 등록된 정식 상호를 한글로, 띄어쓰기 없이 입력하세요.
  - 예시 형식: `hacklipse{서울숲가든카페}` (실제 정답 아님)
value: 100
type: standard

flags:
  - hacklipse{비스타블루베이커리카페}
  # 관대 채점용 추가 플래그 (원하면 주석 해제)
