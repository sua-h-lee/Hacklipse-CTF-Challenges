services:
  member-app:
    build: .
    ports:
      - "127.0.0.1:9022:80"
    environment:
      APP_DB: /var/lib/member-app/users.sqlite3
      INITIAL_USERS: ${INITIAL_USERS:?Set INITIAL_USERS in a private environment file}
    volumes:
      - member-data:/var/lib/member-app
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/apache2:size=1m
      - /var/lock/apache2:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
volumes:
  member-data:
